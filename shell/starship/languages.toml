# All Starship language/version modules (icon + version). Hex from linguist colors.json.

[package]
format = '[$symbol$version]($style) '
symbol = '󰏗 '
style = 'bold fg:3'

[buf]
format = '[$symbol($version)]($style) '
symbol = ' '
style = 'bold #519aba'

[bun]
format = '[$symbol($version)]($style) '
symbol = ' '
style = 'bold #f1e05a'

