"$schema" = 'https://starship.rs/config-schema.json'

add_newline = false
format = "$status$username$hostname$battery$directory$git_branch$git_metrics$git_status$custom$nix_shell$all$character"

[custom.unused_nix_shell]
style = "bold fg:8"
when = "test -e shell.nix || test -e flake.nix && ! test $IN_NIX_SHELL"
shell = "sh"
format = "[ ]($style) "

[line_break]
disabled = true

[directory]
style = "bold fg:4"
read_only = "  "
read_only_style = "bold fg:15"
truncation_length = 3

[cmd_duration]
disabled = false
min_time = 3000
format = "[$duration]($style) "
style = "bold fg:11"

[git_metrics]
disabled = false
added_style = "bold fg:10"
deleted_style = "bold fg:9"

[git_branch]
format = '[$symbol$branch(:$remote_branch)]($style) '
truncation_symbol = ""
style = "bold fg:13"

[git_status]
style = "bold fg:9"

[git_state]
style = "bold fg:11"

[status]
disabled = false
format = '[$symbol](bold bg:9 bold fg:0)[ $status](bold bg:0 bold fg:9) '
style = 'bold fg:9'
map_symbol = true
pipestatus = true
symbol = ' ERROR '
not_executable_symbol = ' FAIL '
not_found_symbol = ' ERROR '
sigint_symbol = ' DEBUG '
signal_symbol = ' FATAL '
pipestatus_format = '\[$pipestatus\] => [$symbol$common_meaning$signal_name$maybe_int]($style) '
pipestatus_segment_format = '[$symbol$status]($style)'

[nix_shell]
symbol = " "
format = '[$symbol]($style) '
style = 'bold fg:14'

[docker_context]
symbol = " "
style = 'bold fg:12'
format = '[$symbol($context)]($style) '
[aws]
disabled = true
style = 'bold fg:11'
symbol = 'aws '
format = '[$symbol($profile ) (\[$region\] )]($style)'
